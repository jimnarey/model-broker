[project]
name = "model-broker"
version = "0.1.0"
description = "OpenAI-compatible broker for managed local LLM services"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = [
    "src",
    "tests",
    "model-broker-host-facts.py",
    "model-broker-host-factsctl.py",
]
exclude = [".venv", ".git"]
reportMissingTypeStubs = "none"

[project]
name = "model-broker"
version = "0.1.0"
description = "OpenAI-compatible broker for managed local LLM services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# Production code is strict; tests are checked in standard mode, where JSON responses
# and the dynamically loaded host-facts module do not need a cast at every access.
typeCheckingMode = "standard"
include = [
    "src",
    "tests",
    "model-broker-host-facts.py",
    "model-broker-host-factsctl.py",
]
strict = ["src", "model-broker-host-facts.py", "model-broker-host-factsctl.py"]
exclude = [".venv", ".git"]
reportMissingTypeStubs = "none"
